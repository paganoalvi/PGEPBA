<style>
    /* ==== GLOBAL / RESET ==== Estilos globales ====*/
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: sugerenciasLista;
      font-family: "Quicksand", sans-serif;
      /*background-image: url('https://github.com/SZ1011h/PortalGestionImages/blob/main/fondoGestionOPcional.png?raw=true');*/
      background-image:url('https://drive.google.com/file/d/1ElvGut7ZUm3mI-jPaHmqXuF-91hwUQqT/view?usp=sharing');
      background-color: gray;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }  
    /*////////////////////////////*/
    /* ==== NAVBAR / ENCABEZADO ==== */
    /*////////////////////////////*/  
    nav {
        position: fixed;
        top: 0px; 
        width: 100%;
        height: auto;
        background-color: transparent; /* Transparente por defecto */
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        z-index: 1; /* Asegura que esté por encima de otros elementos */
        text-align: right; /* Alinea el contenido hacia la derecha */
    }
    header h2{
      color: var(--darkreader-text-ffffff, #e8e6e3);
      display: inline;
      z-index: 99;
      position: sticky;
      cursor: pointer;
    }
    nav ul{
        display: inline-flex; /* Organiza los elementos en una fila alineada a la derecha */
        list-style-type: none; /* Elimina los puntos de la lista */
        justify-content: flex-end; /* Alinea los elementos hacia la derecha */
        width: auto;; /* Asegura que los elementos no ocupen todo el ancho */
        margin-right: 1rem;
        padding-inline-start: 0;
        margin-block-start: 0;
        margin-block-end: 0;
    }
    nav li {
        font-size: 25px;
        font-family: "Quicksand", sans-serif;
        cursor: pointer; /* Cambia el cursor cuando pasas sobre los elementos */
        padding: 10px;
        color: #FFFFFF
    }
    nav li a {
        text-decoration: none; /* Elimina el subrayado por defecto de los enlaces */
    }
        nav li:hover {
            color: #ff7d3b; /* Cambia el color al pasar el mouse por encima */
        }
        nav.scrolled {
          background-color: black; /* Cambia a negro al hacer scroll */
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Añade sombra para destacar */
        }
    
    /*////////////////////////////*/
    /* ==== CUERPO PRINCIPAL ==== */
    /*////////////////////////////*/

         /*Secciones de contenido */
    .contenido {
      display: none;
      position: relative;
      top: 51px;          /*<------------  relativos al contenedor, no al viewport */
    }
         /* Hace visible la página*/
    .visible {
        display: block;
    }
      

        /*Tarjetas y componentes*/
    #contenedorElementos{
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-block: 0px;
    }
    .contenedorTarjetas{
      position: relative;
      height: auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 50%;
      place-items: center;
      margin-block-start: 10px;
    }
    .tarjeta {
      height: auto;
      width: auto;
      display: flex;
      flex-flow: column;
      justify-content: center;
      align-items: center;
      margin-block-end: 60px;
    }

    .tarjeta img {
      width: 8rem;        /*<-----------  Unidad fija */
      height: 8rem;       /*<-----------  Unidad fija */
      transition: transform 0.4s ease;
      cursor: pointer; 
    }
    .tarjeta img:hover{
      transform: scale(1.2);
    }

    .tarjetasResultados{
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .tarjetaGrafico{
      margin-block-end: 0;
    }
    .tarjetasCartera{
      display: inline-flex;
      flex-wrap: wrap;
      width: 100%;
      justify-content: space-evenly;
    }
    h2 {
      font-size: 1.45rem;      /*<-----------  Unidad fija */
      font-weight: 600;
      text-align:center;
      color: white;
      padding: 0 0.3125rem;    /*<-----------  Unidad fija */
      margin: 1.25rem 0;      /* <-----------  Unidad fija */
    }

        /*Botones*/
    button{
      background-color:white;
      border:2px solid #7c7c7c;  /* <------------ Unidad fija e incorpore la línea de abajo */
      font-size: 1rem;           /* <-----------  Unidad fija */
      font-weight:600;
      color:black;
    }
    button:hover {
      cursor: pointer;
      outline: 2px solid;
      transform: scale(1.05);
      transition: 0.3s;
    }
    button:active {
      outline-color: #ff7d3b;
      color: #ff7d3b;
      transition: 0s;
    }
    .posBotones{
      display: grid;
      grid-template-columns: 1fr repeat(4, 2fr) 1fr;
      grid-template-rows: repeat(3, 50px);
      gap: 4px;
    }
    .posBotones button {
      font-size: 15px;
      grid-column-start: 3 span;
    }
    .posBotones button:first-child{
      grid-column: 3/5;
    }
    .BotonRepetir{
      background-color: #292828;
      color: #ffffff;
      border-color: #ffffff;
    }
    #balance_div{
      color: white;
      font-size: 25px;
    }

    .FuncionesAdicionales{
      background-color: hsl(32, 100%, 45%);
      padding: 12px;
    }
          /* Contenedor de la imagen */
    .image-container {
      position: relative;
      width: 100%;
      height: 100vh;      /* <--------------  100% del alto del viewport */
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed; /* Activa el parallax */
      z-index: 1;
      overflow: hidden;
    }

          /* Texto sobre la imagen */
    .texto-sobre-imagen {
      font-size: 2.2rem;     /*<----------- Más accesible y flexible */
      padding: 0 5vw;        /*<-----------/* Viewport Width */
      text-align: center;
      color: #FFFFFF;
      position: absolute;
      z-index: 10;
      top: 10%;
      font-weight: 100; 
    }
    p{
      color: white;
    }
    .modal-prellenado {
      display: none; /* Oculto por defecto */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5); /* Semitransparente */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* Cuadro del modal */
    .modal {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }
    .selector button {
    background-color: #eee;
    border: 1px solid #ccc;
    padding: 10px;
    margin: 5px;
    cursor: pointer;
  }

  .selector button.activo {
    background-color: #4caf50;
    color: white;
    border-color: #4caf50;
  }
    /*////////////////////////////*/
    /* ==== MEDIA QUERIES ==== */
    /*////////////////////////////*/
    @media (max-width: 1000px){
      .contenido{
        height: auto;
      }
      .contenedorTarjetas {
        height: auto;
        width: 90%;
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
        grid-auto-rows: initial;
      } 
    }

  </style>
