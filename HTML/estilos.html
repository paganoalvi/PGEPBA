<style>
    //* ==== GLOBAL / RESET ==== Estilos globales ====*//
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Quicksand", "sans-serif";
      background-image:url('https://i.imgur.com/3UCTpEZ.jpeg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
    }  
  //*///////////////////////////////*//
  //* ==== NAVBAR / ENCABEZADO ==== *//
  //*///////////////////////////////*//  
    nav {
        position: fixed;
        text-align: right; /* Alinea el contenido hacia la derecha */
        top: 0px; 
        width: 100%;
        height: auto;
        z-index: 1; /* Asegura que esté por encima de otros elementos */
        
        animation: animacion-header linear both;
        animation-timeline: scroll(root block);
        animation-range: 0 20%;
        box-shadow: 0 0 10px;
    }
    nav ul{
        display: inline-flex; /* Organiza los elementos en una fila alineada a la derecha */
        list-style-type: none; /* Elimina los puntos de la lista */
        justify-content: flex-end; /* Alinea los elementos hacia la derecha */
        width: auto; /* Asegura que los elementos no ocupen todo el ancho */
        margin-right: 1rem;
        padding-inline-start: 0;
        margin-block-start: 0;
        margin-block-end: 0;
    }
    
    nav li {
        font-size: 25px;
        cursor: pointer; /* Cambia el cursor cuando pasas sobre los elementos */
        padding: 10px;
        color: white;
        border-radius: 5px;
        transition: background-color 0.4s, box-shadow 0s;

        &:hover{
          color: #333333; /* Cambia el color al pasar el mouse por encima */
        }
    } 
    nav li a {
        text-decoration: none; /* Elimina el subrayado por defecto de los enlaces */
    }
    .liProducto{  
        position: fixed;
        left: 1rem;
    }

      .activo{
        background-color: #05B7B3;
        box-shadow: 0px 0px 5px #196377;
      }    
 
    @keyframes animacion-header{
      to{
        background: #333333F3;
        background: rgba(255, 255, 255, .5);
      }
    }
    
    //*////////////////////////////*//
  //* ==== CUERPO PRINCIPAL ==== *//
  //*////////////////////////////*//

    //--------------------------------//
    //*************Paginas************//

    //Ocultar Pagina//
    .contenido {
      display: none;     
    }
    //Mostrar Pagina//
    .visible {
      display: block;
      position: relative;
      top: 51px;

      view-transition-name: visible;
    }
    //Animar Pagina//
        ::view-transition-old(visible){
          animation: fadeOut 1s forwards;
        }
        ::view-transition-new(visible){
          animation: fadeIn 1s forwards;
        }

          @keyframes fadeOut{
            from{
              transform: translateX(0);
            }
            to{
              transform: translateX(100%);
            }
          }
          @keyframes fadeIn{
            from{
              transform: translateX(100%);
            }
            to{
              transform: translateX(0);
            }
          }
    //--------------------------------//
    //*****Tarjetas y componentes*****//
    
    //Generales
    .tarjeta {
      height: auto;
      width: auto;
      display: flex;
      flex-flow: column;
      justify-content: center;
      align-items: center;
      margin-block-end: 60px;
    }
    .tarjeta img {
      width: 8rem;        <----------- /* Unidad fija */
      height: 8rem;       <----------- /* Unidad fija */
      transition: transform 0.4s ease;
      cursor: pointer; 
      &:hover{
        transform: scale(1.2);
        transition: 0.3s;
      }
    }
 
    //de Pagina Gestion//
    .container-card-Gestion{
      position: relative;
      height: auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 50%;
      place-items: center;
      margin-block-start: 10px;
    }
    .FuncionesAdicionales{
      background-color: #c44384;
      padding: 12px;
      display: none;
    }
    .posicionBotones{
      //display: grid;
      //grid-template-columns: 1fr repeat(4, 2fr) 1fr;
      //grid-template-rows: repeat(3, 50px);
      gap: 4px;

      display: flex;
      justify-content: center;
    }
        //°°° Cuadro del modal °°°//
        .modal {
          background: #fff;
          padding: 20px;
          border-radius: 10px;
          width: 320px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        .selector button {
        background-color: #eee;
        border: 1px solid #ccc;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
        }
        .modal-prellenado {
          display: none; /* Oculto por defecto */
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5); /* Semitransparente */
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }
    //de Pagina Resultado//
    .container-cards-Resultado{
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .tarjetaGrafico{
      margin-block-end: 0;
    }
    .container-cards-Resultado-carteras{
      display: inline-flex;
      flex-wrap: wrap;
      width: 100%;
      justify-content: space-evenly;
    }
    h2 {
      font-size: 1.45rem;      <----------- /* Unidad fija */
      font-weight: 600;
      text-align:center;
      color: white;
      padding: 0 0.3125rem;    <----------- /* Unidad fija */
      margin: 1.25rem 0;       <----------- /* Unidad fija */
    }
    p{
      color: white;
    }
    //de Pagina Crear tu Producto
    .banner{
      display: flex;
      justify-content: center;
    }
    .bannerImg{
      background-size: 100% 100%;
      background-image: 100%;
    }
    .seccionMateriaPrima{
      display: flex;
      justify-content: center;
    }
    #contenedorElementos{
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-block: 0px;
    }
    .cargando {
      cursor: wait;
    }
    
    
    //---------------------------//
    //**********Botones**********//
    .Btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: 0.3s;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
      background-color: rgb(53, 53, 53);
    }
      /* plus sign */
      .svgWrapper {
        width: 100%;
        transition-duration: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .svgIcon {
        width: 17px;
      }

      /* text */
      .text {
        position: absolute;
        right: 0%;
        width: 0%;
        opacity: 0;
        color: white;
        font-size: 1.2em;
        font-weight: 600;
        transition-duration: 0.3s;
      }
      /* hover effect on button width */
      .Btn:hover {
        width: 165px;
        border-radius: 40px;
        transition-duration: 0.3s;
      }

      .Btn:hover .svgWrapper {
        width: 30%;
        transition-duration: 0.3s;
        padding-left: 20px;
      }
      /* hover effect button's text */
      .Btn:hover .text {
        opacity: 1;
        width: 70%;
        transition-duration: 0.3s;
        padding-right: 10px;
      }
      /* button click effect*/
      .Btn:active {
        transform: translate(2px, 2px);
      }

    button{
      background-color:white;
      border:2px solid #7c7c7c;   <------------/* Unidad fija e incorpore la línea de abajo */
      font-size: 1rem;            <----------- /* Unidad fija */
      font-weight:600;
      color:black;
    
      &:hover{
        cursor: pointer;
        outline: 2px solid;
        transform: scale(1.05);
        transition: 0.3s;
      }
      &:active{
        outline-color: #ff7d3b;
        color: #ff7d3b;
        transition: 0s;
      }
    }
    
    .Btn:hover .svg-icon {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(-360deg);
      }
    }

    .posicionBotones button {
      font-size: 15px;
      grid-column-start: 3 span;
    }
    .posicionBotones button:first-child{
      grid-column: 3/5;
    }
    .BotonRepetir{
      background-color: #292828;
      color: #ffffff;
      border-color: #ffffff;
    }

    .selector button.activo {
      background-color: #4caf50;
      color: white;
      border-color: #4caf50;
    }
    
    /*////////////////////////////*/
    /* ==== MEDIA QUERIES ==== */
    /*////////////////////////////*/
    @media (max-width: 1000px){
      .contenido{
        height: auto;
      }
      .container-card-Gestion {
        height: auto;
        width: 90%;
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
        grid-auto-rows: initial;
      } 
    }
</style>
