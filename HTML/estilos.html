<style>
    //* ==== GLOBAL / RESET ==== Estilos globales ====*//
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Quicksand", "sans-serif";
      background-color: white;
      scrollbar-gutter: stable;
      overflow-y: auto;
    }  
  //*///////////////////////////////*//
  //* ==== NAVBAR / ENCABEZADO ==== *//
  //*///////////////////////////////*//  
    nav {
        position: fixed;
        top: 5px; 
        width: 100%;
        height: auto;
        z-index: 1; /* Asegura que esté por encima de otros elementos */
    }
    nav ul{
        position: relative; 
        display: flex; 
        list-style-type: none; /* Elimina los puntos de la lista */
        justify-content: flex-end; 
        
        max-width: 1200px; 
        border-radius: 20px;
        padding-inline: 10px;
        font-weight: 500;
        margin: 0 auto;
        padding-inline-start: 0;
        margin-block-start: 0;
        margin-block-end: 0;

        background-color: #c44384;
        color: white;
        animation: animacion-header linear both;
        animation-timeline: scroll(root block);
        animation-range: 0 20%;
        box-shadow: 0 0 10px #c44384;
    }
      nav li {
          padding: 10px;
          font-size: 25px;
          border-radius: 5px;
          cursor: pointer; /* Cambia el cursor cuando pasas sobre los elementos */
          
          transition: background-color 0.4s, box-shadow 0s;
          animation: color-text-navigation linear both;
          animation-timeline: scroll(root block);
          animation-range: 0 51px;

          &:hover{
            color: #333333; /* Cambia el color al pasar el mouse por encima */
          }
      } 
      nav li a {
        text-decoration: none; /* Elimina el subrayado por defecto de los enlaces */
      }
      nav li:nth-child(4){
        margin-right: 10px; 
        position: relative;
        
        &:hover{
          color: #05B7B3; /* Cambia el color al pasar el mouse por encima */
        }
      }
      #nav-inicio{  
        position: absolute;
        left: 0;
        margin-left: 10px;
      }
      .activo{
        background-color: #05b7b3;
        box-shadow: 0px 0px 5px #196377;
        border-radius: 20px;
      }   

      .nav-volver {
        display: none; /* oculto por defecto */
      }

      .nav-volver.show {
        display: flex;
        height: 100%;
        align-items: center;
        background-color: #05b7b3;
        box-shadow: 0px 0px 5px #196377;
        border-radius: 20px;
      }
 
    @keyframes animacion-header{
      to{
        background: rgba(255, 255, 255, .5);
        backdrop-filter: blur(6px);
      }
    }
    @keyframes color-text-navigation{
      to{
        color: black;
      }
    }
    
  //*////////////////////////////*//
  //* ==== CUERPO PRINCIPAL ==== *//
  //*////////////////////////////*//

    //--------------------------------//
    //*************Paginas************//

    //Ocultar Pagina//
    .contenido {
      display: none;     
    }
    //Mostrar Pagina//
    .visible {
      display: block;
      padding-top: 61px;
      view-transition-name: visible;
    }
    //Animar Pagina//
        ::view-transition-old(visible){
          animation: fadeOut 1s forwards;
        }
        ::view-transition-new(visible){
          animation: fadeIn 1s forwards;
        }

          @keyframes fadeOut{
            from{
              transform: translateX(0);
            }
            to{
              transform: translateX(100%);
            }
          }
          @keyframes fadeIn{
            from{
              transform: translateX(100%);
            }
            to{
              transform: translateX(0);
            }
          }

    #gestion, #resultado, #definirProducto{
      padding-inline: 30px;
    }

    //--------------------------------//
    //*****Tarjetas y componentes*****//
    h2{
      text-align:center;
      margin-block-start: 0;
      margin-block-end: 20px;
      color: #333333;
    }
    //Generales
    .card {
      display: flex;
      flex-flow: column nowrap;
      align-items: center;
      gap: 6px;
    }
    .cardGrafica{
      border: 1.5px solid #c44384;
      box-shadow: 0 0 10px #c44384;
      border-radius: 7px;
      background-color: rgb(255, 255, 255);
      padding: 5px;
    }
    .container{
      display: grid;
      gap: 5px;
      padding: 5px;
      marigin: 0 auto;
    }

    // --- de Pagina Gestion ---//
    #gestion{

      >div{
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;

        .containerCards-Gestion{
          border: 1.5px solid #05b7b3;
          box-shadow: 0 0 10px #05b7b3;
          border-radius: 20px;
          grid-template-columns: repeat(6, 1fr);
          grid-auto-rows: 50%;
          place-items: center;
          height: 100vh;
          width: 100%;
        
          .card-gestion{
            width: auto;
            min-width: 0;
            gap: 12px;

            grid-column: span 2;
          }

          :nth-child(4){
            grid-column-start: 2;
            grid-column-end: 4;
          }
          :nth-child(5){
            grid-column-start: 4;
            grid-column-end: 6;
          }
        }
        
      }
    }
      
      .card-gestion img,
      .containerCards-Resultados3 img{
        max-width: 180px;
        height: auto;
        aspect-ratio: 89 / 67;
        transition: transform 0.4s ease;
        cursor: pointer;
        border: 1.5px solid #c44384;
        box-shadow: 0 0 10px #c44384;
        border-radius: 5px;
        &:hover{
          transform: scale(1.11);
          transition: 0.3s;
        }
      }
      /* Estilos de botones desplegables */
      #toggle-configuracion{
        display: none;
      }
      #toggle-compra{
        display: none;
      }
      #toggle-produccion{
        display: none;
      }
      #toggle-venta{
        display: none;
      }
      #toggle-costoFijo{
        display: none;
      }

      /* Estilo del botón principal */
      .toggle-label {
        background: #c44384;
        color: white;
        font-family: inherit;
        font-weight: 600;
        font-size: 15px;
        border-radius: 5px;
        cursor: pointer;
        padding: 3.5px;

        &:hover{
          transform: translate(-0.05em, -0.05em);
        }
      }

      /* Icono flecha */
      svg{
        cursor: pointer;
      }
      .icon {
        display: inline-block;
        transition: transform 0.3s ease;

        vertical-align: middle;
        padding-bottom: 3px;
      }

      /* Rotar icono al activar */
      #toggle-compra:checked + .toggle-label .icon {
        transform: rotate(180deg);
      }
      #toggle-produccion:checked + .toggle-label .icon {
        transform: rotate(180deg);
      }
      #toggle-venta:checked + .toggle-label .icon {
        transform: rotate(180deg);
      }
      #toggle-costoFijo:checked + .toggle-label .icon {
        transform: rotate(180deg);
      }

      /* Contenedor de botones */
      .buttons-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 2px;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: all 0.5s ease;
      }
      .buttons-container  button:nth-child(1){
        background-color: #17a8bd;
        color: white;
      }
      .buttons-container button{
        color: black;
      }

      /* Mostrar botones cuando está activado */
      #toggle-configuracion:checked ~ .opction-configuration{
        display: flex;
        max-height: 500px;
        opacity: 1;
      }
      #toggle-configuracion:checked + label svg{
        color: #128697;
        box-shadow: 0 0 10px;
        border-radius: 50%;
      }
      #toggle-compra:checked ~ .buttons-container {
        max-height: 500px;
        opacity: 1;
      }
      #toggle-produccion:checked ~ .buttons-container {
        max-height: 500px;
        opacity: 1;
      }
      #toggle-venta:checked ~ .buttons-container {
        max-height: 500px;
        opacity: 1;
      }
      #toggle-costoFijo:checked ~ .buttons-container {
        max-height: 500px;
        opacity: 1;
      }
      
      .BotonRepetir{
        width: 100%;
      }
      
      
      .BotonEliminarEmpe {
        width: 200px;
        padding: 12px;
        background: #f44336;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .BotonCobros{
        width: 200px;
        padding: 12px;
        background: #4caf50; /* Verde para ingresos */
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .BotonCobros:hover{
        background: #388e3c; /* Verde más oscuro */
      }
      .BotonPagos{
        width: 200px;
        padding: 12px;
        background: #ff9800; /* Naranja para pagos salientes */
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .BotonPagos:hover {
        background: #f57c00; /* Naranja más oscuro */
      }

      .BotonEliminarEmpe:hover {
        background: #d32f2f;
      }

      /* Botones individuales */
      .buttons-container button {
        padding: 8px;
        background-color: #f0f0f0;
        border: 1px solid #333333;
        border-radius: 4px;
        cursor: pointer;
        transform: translateY(-10px);
        opacity: 0;
        animation: fadeInUp 0.3s ease forwards;
      }

      /* Animaciones escalonadas */
      .buttons-container button:nth-child(1) { animation-delay: 0.1s; }
      .buttons-container button:nth-child(2) { animation-delay: 0.2s; }
      .buttons-container button:nth-child(3) { animation-delay: 0.3s; }
      .buttons-container button:nth-child(4) { animation-delay: 0.4s; }
      .buttons-container button:nth-child(5) { animation-delay: 0.5s; }

      .opction-configuration{
        display: none;
        flex-direction: column;
        position: absolute; /* Flota sobre el resto */
        overflow: hidden;
        top: 100%;           /* Justo debajo del botón */
        right: 10px;
        gap: 3px;
        padding-top: 2px;
        max-height: 0;
        opacity: 0;
        transition: all 0.5s ease;
      }
      .opction-configuration button{
        padding: 5px;
        background-color: #17a8bd;
        border-radius: 4px;
        cursor: pointer;
        transform: translateY(-10px);
        opacity: 0;
        animation: fadeInUp 0.3s ease forwards;
      }
        .opction-configuration button:nth-child(1) { animation-delay: 0.1s; }
        .opction-configuration button:nth-child(2) { animation-delay: 0.2s; }
      /* Keyframes */
      @keyframes fadeInUp {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

        //°°° Cuadro del modal °°°//
        .modal {
          background: #fff;
          padding: 20px;
          border-radius: 10px;
          width: 320px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        .selector button {
        background-color: #eee;
        border: 1px solid #ccc;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
        }
        .modal-prellenado {
          display: none; /* Oculto por defecto */
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5); /* Semitransparente */
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }


    /* --- de Pagina Resultado --- */
      //1°Tabla (Compras, ventas, stock, ect)
    .containerCards-Resultados1{
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding:5px;
      max-width: 1200px;
      margin: 0 auto;
      margin-block-end: 20px;

    }
      .cardResultado1:nth-child(1),
      .cardResultado1:nth-child(2){
        grid-column: span 1;
        min-width: 25%;
      }
      .cardResultado1:nth-child(3),
      .cardResultado1:nth-child(4){
        grid-column: span 2;
        min-width: 50%;
      }
        .cardResultado1:nth-child(4){
          grid-column: 3 / 5;
          grid-row: 2 / 3;
        }
      .cardResultado1:nth-child(5),
      .cardResultado1:nth-child(6){
        grid-column: span 1;
        min-width: 25%;
      }
        .cardResultado1:nth-child(5){
          grid-row: 2;
        }
      .cardTexResultados input{
        border: 1.5px solid #333333;
        width: auto;
        padding: 12px 10px;
        border-radius: 4px;
        font-size: 15px;
      }
      .cardTexResultados{
        justify-content: space-between;
      }
      .cardTexResultados p{
        margin-block-start: 0;
        margin-block-end: 0;
        text-align: center;
        font-weight: 600;
      }
  .containerGrafico-Compra-Venta,
  .containerGrafico-Stok{
    aspect-ratio: 16 / 9; 
    width: 100%;      
    max-height: 215px;   
    overflow: auto;       
  }
  //2°Tabla (Punto de equilibrio, tabla de indicadores, etc)
    .containerCards-Resultados2{
      display: flex;
      flex-flow: column nowrap;
      max-width: 815px;
      margin: 0 auto;

    }

      aspect-ratio: 16 / 9;

      overflow: auto;
    }
  //2°Table (Iconos de redireccinamiento al excel)
    .containerCards-Resultados3{
      display: flex;
      width: 100%; 
      max-width: 1200px;
      margin: 0 auto;
      justify-content: space-between;
      margin-block-end: 20px;
    }
    .containerCards-Resultados3 section:nth-child(1) img{
        transform-origin: bottom left;
      }
      .containerCards-Resultados3 section:nth-child(2) img,

    .modalGrafico {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;

      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease; /* Transición suave */
    }

    .modal-content {
      position: relative;
      background: white;
      border-radius: 8px;
      max-width: 95vw;
      max-height: 95vh;
      overflow: hidden;
    }

    .close-modal {
      position: absolute;
      right: 15px;
      top: 10px;
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    #modalChartContainer{
      width: 100%;  /* Ocupa todo el content */
      height: 100%; /* Ocupa toda la altura */
      margin: 0;    /* Sin márgenes extra */
    }

    .close-modal:hover {
      color: black;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
}
