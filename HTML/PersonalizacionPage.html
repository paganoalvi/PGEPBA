<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>


		.contenedoresForms{
			display: flex;
      margin: 20px;
		}


		/*/////////////////////////////
	    //STYLE BOTONES DE AGREGAR COSAS
	    ///////////////////////////////*/

	    .botonesAdd{
	        font-size: 16px; /* Tamaño de la fuente */
	        font-family: Arial, sans-serif; /* Tipo de fuente */
	        padding: 10px 20px; /* Espaciado interno del botón */
	        border: none; /* Sin borde */
	        border-radius: 8px; /* Bordes redondeados */
	        background-color: #4CAF50; /* Color de fondo */
	        color: white; /* Color del texto */
	        cursor: pointer; /* Cambia el cursor a un dedo al pasar */
	        transition: transform 0.2s ease, background-color 0.2s ease;
	    }
	    .botonesAdd:hover {
	        background-color: #45a049; /* Cambia el color al pasar el cursor */
	        transform: scale(1.1); /* Aumenta ligeramente el tamaño */
	    }

	    .botonesAdd:active {
	        transform: scale(0.95); /* Reduce ligeramente el tamaño al hacer clic */
	    }
	</style>

</head>
	<body>
		<h2>Personalizar formulario - Compras</h2>
		<div class="contenedoresForms">
			<button type="button" onclick="botonAgregar('Compras','contenedorCompras')" class="botonesAdd">Añadir Articulo</button> 
			<button type="button" class="botonesAdd" style="background-color: red" onclick="botonEliminar('Compras','contenedorCompras')">Eliminar Articulo</button>
		</div>
    <div id="contenedorCompras"></div>
		
		<h2>Personalizar formulario - Produccion</h2>
		<div class="contenedoresForms">
			<button type="button" onclick="botonAgregar('Produccion','contenedorProduccion')" class="botonesAdd">Añadir Producto</button>
			<button type="button" class="botonesAdd" style="background-color: red" onclick="botonEliminar('Produccion','contenedorProduccion')">Eliminar Producto</button>
		</div>
		<div id="contenedorProduccion"></div>	

		<h2>Personalizar formulario - Pedidos</h2>
		<div class="contenedoresForms">
			<button type="button" onclick="botonAgregar('Pedidos','contenedorPedidos')" class="botonesAdd">Añadir Cliente</button>
			<button type="button" class="botonesAdd" style="background-color: red" onclick="botonEliminar('Pedidos','contenedorPedidos')">Eliminar Cliente</button>
		</div>
    <div id="contenedorPedidos"></div>

		<h2>Personalizar formulario - Costos Fijos</h2>
		<div class="contenedoresForms">
				<button type="button" onclick="botonAgregar('CostoFijo','contenedorCostoFijo')" class="botonesAdd">Añadir Empleado</button>
			  <button type="button" class="botonesAdd" style="background-color: red" onclick="botonEliminar('CostoFijo','contenedorCostoFijo')" >Eliminar Empleado</button>
		</div>
    <div id="contenedorCostoFijo"></div>


		<script>

		////////////////////////////////////////////
	  // EVENTO APARECER INPUT////////////////////
		////////////////////////////////////////////

			function botonEliminar(bid,tipoContenedor){
        const contenedor = document.getElementById(tipoContenedor);
				logicaInput(bid,contenedor,crearInput(contenedor,false),false);
			}
			function botonAgregar(bid,tipoContenedor){
        const contenedor = document.getElementById(tipoContenedor);
				logicaInput(bid,contenedor,crearInput(contenedor,true),true);
			}

		    function crearInput(contenedor,esAgregar){
		    	const inputId = "aprenderInputs";
		        const inputExiste = document.getElementById(inputId);

		        // Eliminar el elemento si ya existe
		        if (inputExiste) {
		            contenedor.removeChild(inputExiste);
		            return null;
		        } else {
		            input = document.createElement('input');
		            input.type = 'text';
		            input.id = inputId;
                if(esAgregar){
                  input.placeholder = 'Articulo a agregar:';
                }else{
                  input.placeholder = 'Articulo a ELIMINAR:';
                }
		            input.style.width = '200px';
		            input.style.height = '30px';
		            input.style.fontSize = '17px';
		            return input;
		    	}
			}
		        
		    function logicaInput(bAddId, contenedor, input, esAgregar) {
          if (!contenedor || !input) return; 

          // Si ya existe un datalist en el contenedor, lo elimina para evitar duplicados
          let dataListExistente = document.getElementById("sugerenciasLista");
          if (dataListExistente) {
              dataListExistente.remove();
          }

          // Crear lista de sugerencias
          const dataList = document.createElement('datalist');
          dataList.id = "sugerenciasLista";
          input.setAttribute("list", "sugerenciasLista");

          // Llamar a Google Apps Script para obtener los ítems
          google.script.run.withSuccessHandler((items) => {
              dataList.innerHTML = ""; // Limpiar sugerencias previas
              items.forEach(item => {
                  const option = document.createElement('option');
                  option.value = item; // Agregar cada ítem como sugerencia
                  dataList.appendChild(option);
              });
          }).obtenerItemsFormulario(bAddId); // Función en Apps Script que obtiene los ítems

          // Detectar cuando se presiona Enter
          input.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') { // Detecta la tecla Enter
                  event.preventDefault(); // Evita el comportamiento predeterminado
                  const valor = input.value.trim();

                  if (valor) {
                      if (esAgregar) {
                          google.script.run.agregarFinal(valor, bAddId); // Llamada a Google Apps Script
                      } else {
                          alert('El valor ' + valor + ' ha sido ELIMINADO.');
                          google.script.run.eliminarElemento(valor, bAddId); // Llamada a Google Apps Script
                      }
                      input.value = ''; // Limpiar el campo de entrada
                  } else {
                      alert('Por favor, escribe algo antes de enviar.');
                  }
              }
          });
          contenedor.appendChild(input);
          contenedor.appendChild(dataList); // Agregar lista de sugerencias   
      }

		</script>
	</body>
</html>
