    function mostrarPagina(id, navegador) {
      document.startViewTransition(() => {
        // Ocultar todos los divs(páginas) de contenido
        const secciones = document.querySelectorAll('.contenido');
        secciones.forEach(sec => sec.classList.remove('visible'));

        // Mostrar solo la seleccionada
        document.getElementById(id).classList.add('visible');
      })
  
      //Estila el Header de la sección donde se encuentra el usuario
      navegador.parentElement.querySelectorAll('li').forEach(li => li.classList.remove('activo'));
      navegador.classList.add('activo');
    }

            };

        case "ventas:":

    async function obtenerBalance() {
      const ventas = await ventasChart();   // Espera a que se resuelva la Promesa
      const compras = await comprasChart(); // Igual aquí
      const valorBalance = ventas - compras;
      const visualizacionDiv = document.getElementById("balance_div");
      const balanceFormateado = formatearNumero(valorBalance);
      if (balanceFormateado >= 0) {
        visualizacionDiv.innerHTLM = `BALANCE :: <span style="color: green; font-weight: bold;">$${balanceFormateado}</span>`;
      } else {
        visualizacionDiv.innerHTML = `BALANCE :: <span style="color: red; font-weight: bold;">$${balanceFormateado}</span>`;
      }
    }

    function mostrarAlertaTemporal(mensaje, duracionMs = 2000) {
      const alerta = document.getElementById("alertaTemporal");
      const overlay = document.getElementById("overlayBloqueo");

      alerta.textContent = mensaje;

      overlay.style.display = "block"; // Bloquea el fondo
      alerta.style.display = "block";  // Muestra el mensaje

      setTimeout(() => {
        alerta.style.display = "none";
        overlay.style.display = "none";
      }, duracionMs);
    }



    //-----------------Agregar elementos------------------//
    function agregarElemento(idFormulario) {
      let contador = 1;
      const form = document.getElementById(idFormulario);
      const original = form.querySelector("fieldset");
      const clon = original.cloneNode(true);

      // Agregar clase para identificar que es un clon
      clon.classList.add("clonado");

      //°°°°°°°Unicidad de IDs para correcto manejo de datos°°°°°°//
      // Limpiar los valores del clon y generar nuevos IDs únicos
      const inputs = clon.querySelectorAll("input, select, textarea");
      inputs.forEach((input) => {
        input.value = "";

        if (input.id) {
          const baseId = input.id.split("-")[0]; // id base sin sufijo
          const nuevoId = baseId + "-" + contador;
          input.id = nuevoId;

          // Buscar el label asociado al id base y actualizar su atributo for
          const label = clon.querySelector(`label[for="${baseId}"]`);
          if (label) {
            label.setAttribute("for", nuevoId);
          }
        }
      });
      // Recargar las opciones de materia prima en el nuevo select clonado
      const newSelectMateriaPrima = clon.querySelector('select[name="materiaPrima[]"]');
      if (newSelectMateriaPrima) {
          // Limpiar opciones existentes (excepto la primera)
          while (newSelectMateriaPrima.options.length > 1) {
              newSelectMateriaPrima.remove(1);
          }
          // Añadir las opciones actualizadas
          materiasPrimasDisponibles.sort().forEach(mp => {
              const option = document.createElement("option");
              option.value = mp;
              option.textContent = mp;
              newSelectMateriaPrima.appendChild(option);
          });
          newSelectMateriaPrima.value = ""; // Resetear la selección del clon
      }

      //°°°°°° Insertar antes del mensaje final (mantener botón al final)°°°°°°//
      form.appendChild(clon);

      // Incrementar contador
      contador++;

      //°°°°°°Hace el scroll automatico hasta el nuevo clon°°°°°//
      //clon.scrollIntoView({ behavior: "smooth" });
    }

    //---------------Eliminar elementos------------------//
    function eliminarElemento(idFormulario){
      const form = document.getElementById(idFormulario);
      const clones = form.querySelectorAll("fieldset.clonado");
      if (clones.length > 0) {
        form.removeChild(clones[clones.length - 1]);
        contador--;
      }
    }







    //-----------Enviar datos del formulario------------//
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();

      const form = e.target;
      const datos = new FormData(form);

      // Construir arrays desde el formulario
      const materiaPrima = datos.getAll("materiaPrima[]");
      const cantidad = datos.getAll("cantidad[]");
      const unidad = datos.getAll("unidad[]");
      console.log("MATERIAS PRIMAS"+ materiaPrima + "CANTIDAD"+ cantidad+"UNIDADES" +unidad)
      const datoDivisor = (datos.get("user_message") || 1);
      const receta = materiaPrima.map((mat, i) => [
        mat ? mat.trim() : "",
        cantidad[i] || "",
        unidad[i],
        (!datoDivisor || datoDivisor < 1) 
        ? cantidad[i] 
        : cantidad[i] / datoDivisor
      ]);

      const nombreProducto = normalizarTexto( (datos.get("producto") || "").toString() );
      

      if (!nombreProducto) {
        alert("Por favor ingrese el nombre del producto.");
        return;
      }

      // Feedback: desactivar botón submit
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.dataset.orig = submitBtn.textContent;
        submitBtn.textContent = "Guardando...";
      }

      // Llamada al servidor: usamos 'receta' (no listaMateriasP)
      google.script.run
        .withSuccessHandler(function(exito) {
          // Rehabilitar botón
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = submitBtn.dataset.orig || "Enviar";
          }

          if (exito) {             
            cargarProductosDesdeSheets(); // lista de productos sin tener que recarga(javascriptReceta.html)

            // limpiar dinámicos y formulario
            document.querySelectorAll("fieldset.clonado").forEach(el => el.remove());
            form.reset();

            // reiniciar contador 
            contador = 1;

            // refrescar selects de materias primas si hace falta
            if (typeof cargarMateriasPrimasEnSelects === "function") {
              cargarMateriasPrimasEnSelects(); // llamado a app script
            }
          } else {
            alert("No se pudo guardar la receta (tal vez ya existe).");
          }
        })
        .withFailureHandler(function(error) {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = submitBtn.dataset.orig || "Enviar";
          }
          console.error("Error guardando receta:", error);
          alert("Error al guardar la receta: " + (error.message || error));
        })
        .guardarRecetaSheet(receta, nombreProducto, datoDivisor); // llamado a app script
    });
