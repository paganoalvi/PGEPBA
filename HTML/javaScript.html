        secciones.forEach(sec => sec.classList.remove('visible'));

        // Mostrar solo la seleccionada
        document.getElementById(id).classList.add('visible');

      navegador.parentElement.querySelectorAll('li').forEach(li => li.classList.remove('activo'));
      navegador.classList.add('activo');
    }

    async function comprasChart() {
      let fechaInicio = document.getElementById("fechaInicio").value;
      let fechaFin = document.getElementById("fechaFin").value;
      let comprasData, costoD, costoH, costoM;
      if (!fechaInicio || !fechaFin) {
        [comprasData, costoD, costoH, costoM] = await Promise.all([
        fetchSheetData('Compras', `SELECT I WHERE I IS NOT NULL`),
        fetchSheetData('Costos fijos', `SELECT D WHERE D IS NOT NULL `),
        fetchSheetData('Costos fijos', `SELECT H WHERE H IS NOT NULL `),
        fetchSheetData('Costos fijos', `SELECT M WHERE M IS NOT NULL `)
      ]);
      alert("No hay fechas, se mostrará un historico")
      }else{
          //Para que contemple el ultimo dia
        const finDate = new Date(fechaFin);
        finDate.setDate(finDate.getDate() + 1);
        const fechaFinAjustada = finDate.toISOString().split("T")[0]; // yyyy-mm-dd

        [comprasData, costoD, costoH, costoM] = await Promise.all([
          fetchSheetData('Compras', `SELECT I WHERE I IS NOT NULL AND A >= date '${fechaInicio}' AND A < date '${fechaFinAjustada}'`),
          fetchSheetData('Costos fijos', `SELECT D WHERE D IS NOT NULL AND A >= date '${fechaInicio}' AND A < date '${fechaFinAjustada}'`),
          fetchSheetData('Costos fijos', `SELECT H WHERE H IS NOT NULL AND A >= date '${fechaInicio}' AND A < date '${fechaFinAjustada}'`),
          fetchSheetData('Costos fijos', `SELECT M WHERE M IS NOT NULL AND A >= date '${fechaInicio}' AND A < date '${fechaFinAjustada}'`)
        ]);
      }
      

      const totals = { "Compras": 0, "Costos Fijos": 0 };

      [comprasData, costoD, costoH, costoM].forEach((data, index) => {
        const rows = data.getDataTable().getFilteredRows([{ column: 0, minValue: 0 }])
           // Excluye la fila 0 (encabezado)
        rows.forEach(rowIndex => {
          let valor = data.getDataTable().getValue(rowIndex, 0);
          valor = (typeof valor === 'number' && !isNaN(valor)) ? valor : 0;
          if (index === 0) {
            totals["Compras"] += valor;
          } else {
            totals["Costos Fijos"] += valor;
          }
        });
      });

      let montoTotal = totals["Costos Fijos"] + totals["Compras"];
      const dataTable = new google.visualization.DataTable();
      dataTable.addColumn('string', 'Categoría');
      dataTable.addColumn('number', 'Monto');
      dataTable.addRows([
        ['Compras - $'+totals["Compras"], totals["Compras"]],
        ['Costos Fijos - $'+totals["Costos Fijos"], totals["Costos Fijos"]],
      ]);

      const options = {
        title: `Monto total de compras realizadas ::${montoTotal}`,
        pieHole: 0.4,
        legend: { position: 'right' }
      };

      chart = new google.visualization.ColumnChart(document.getElementById('comprasChart_div'));
      chart.draw(dataTable, options);
      return montoTotal;
    }

      if (!fechaInicio || !fechaFin) {

        fetchSheetData('Ventas', `SELECT I WHERE I IS NOT NULL`)
      ]);
        alert("No hay fechas, se mostrará un historico")
      }else{
        const finDate = new Date(fechaFin);
        finDate.setDate(finDate.getDate() + 1);
        const fechaFinAjustada = finDate.toISOString().split("T")[0]; // yyyy-mm-dd

         [ventasP, ventasS] = await Promise.all([

        ]);
      }
      

      const totals = { "Ventas de Productos": 0, "Ventas de Servicios": 0 };

      [ventasP, ventasS].forEach((data, index) => {
        const rows = data.getDataTable().getFilteredRows([{ column: 0, minValue: 0 }]);

        rows.forEach(rowIndex => {
          let valor = data.getDataTable().getValue(rowIndex, 0);
          // Si no es un número, reemplazar por 0
          valor = (typeof valor === 'number' && !isNaN(valor)) ? valor : 0;

          if (index === 0) {
            totals["Ventas de Productos"] += valor;
          } else {
            totals["Ventas de Servicios"] += valor;
          }
        });
      });

      let montoTotal = totals["Ventas de Productos"] + totals["Ventas de Servicios"];

      const dataTable = new google.visualization.DataTable();

      dataTable.addColumn('number', 'Monto');

      async function stockChart() {
        const [productoResponse, cantidadResponse] = await Promise.all([
          fetchSheetData('Hoja 1', "SELECT B WHERE B IS NOT NULL"),
          fetchSheetData('Hoja 1', "SELECT C WHERE C IS NOT NULL")
        ]);

        const productoTable = productoResponse.getDataTable();
        const cantidadTable = cantidadResponse.getDataTable();

        const chartDataArray = [['Producto', 'Cantidad']];
        const numRows = Math.min(productoTable.getNumberOfRows(), cantidadTable.getNumberOfRows());

        for (let i = 0; i < numRows; i++) {
          let nombre = productoTable.getValue(i, 0);
          let valor = cantidadTable.getValue(i, 0);

          nombre = (typeof nombre === 'string') ? nombre : 'Desconocido';
          valor = (!isNaN(Number(valor))) ? Number(valor) : 0;

          chartDataArray.push([nombre, valor]);
        }

        // Ajustar el ancho del gráfico según la cantidad de productos
        const chartWidth = Math.max(600, chartDataArray.length * 80);
        const chartDiv = document.getElementById('stock_divT');
        chartDiv.style.width = chartWidth + 'px';

        const data = google.visualization.arrayToDataTable(chartDataArray);

        const options = {
          title: 'Cantidad total de productos terminados disponibles',
          legend: { position: 'right' },
          annotations: { alwaysOutside: true }
        };

        const chart = new google.visualization.ColumnChart(chartDiv);
        chart.draw(data, options);
      }

    async function fetchSheetData(sheetName, queryText) {
      const queryString = encodeURIComponent(queryText);
      const url = "https://docs.google.com/spreadsheets/d/"+idParaGraficoPrueba+"/gviz/tq?sheet="+sheetName+"&tq="+queryString;
      return new Promise((resolve, reject) => {
        const query = new google.visualization.Query(url);
        query.send(response => {
          if (response.isError()) {
            reject('Error: ' + response.getMessage() + response.getDetailedMessage());
          } else {
            resolve(response);
          }
        });
      });
    }

    function mostrarAlertaTemporal(mensaje, duracionMs = 2000) {
      const alerta = document.getElementById("alertaTemporal");
      const overlay = document.getElementById("overlayBloqueo");

      alerta.textContent = mensaje;

    let contadore = 1;
    let materiasPrimasDisponibles = [];

    // Función para normalizar el texto
    function normalizarTexto(texto) {
      if (!texto) return "";
      texto = texto.trim();
      return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
    }

    function cargarMateriasPrimasDesdeSheets() {
        document.body.classList.add('cargando');
        google.script.run
        .withSuccessHandler(function(materiasPrimas) {
            materiasPrimasDisponibles = materiasPrimas;
            cargarMateriasPrimasEnSelects();
            document.body.classList.remove('cargando');
        })
        .withFailureHandler(function(error) {
            console.error("Error al cargar materias primas:", error);
            alert("Error al cargar materias primas. Recargue la página.");
            document.body.classList.remove('cargando');
        })
        .obtenerMateriasPrimasDeSheet();
    }     

    // Función para cargar en los selects
    function cargarMateriasPrimasEnSelects() {
      const selects = document.querySelectorAll('select[name="materiaPrima[]"]');
      
      selects.forEach(select => {
        // Guardar selección actual
        const selected = select.value;
        
        // Limpiar opciones (excepto la primera)
        while (select.options.length > 1) {
          select.remove(1);
        }
        
        // Agregar materias primas ordenadas
        materiasPrimasDisponibles.sort().forEach(mp => {
          const option = new Option(mp, mp);
          select.add(option);
        });
        
        // Restaurar selección si existe
        if (selected && materiasPrimasDisponibles.includes(selected)) {
          select.value = selected;
        }
      });
    }

    function anadirNuevaMateriaPrima(event) {  // Añade el parámetro event
        const input = document.getElementById("inputNuevaMateriaPrima");
        const nuevaMp = normalizarTexto(input.value);

        if (nuevaMp === "") {
            alert("Por favor, ingrese un nombre para la materia prima.");
            return;
        }

        // Verificar si ya existe localmente
        const existe = materiasPrimasDisponibles.some(mp => normalizarTexto(mp) === nuevaMp);
        if (existe) {
            alert(`La materia prima "${nuevaMp}" ya existe en la lista.`);
            return;
        }

        // Mostrar feedback al usuario
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = "Agregando...";
        button.disabled = true;

        google.script.run
            .withSuccessHandler(function() {
                cargarMateriasPrimasDesdeSheets();
                input.value = "";
                alert(`"${nuevaMp}" ha sido añadida correctamente.`);
                button.textContent = originalText;
                button.disabled = false;
            })
            .withFailureHandler(function(error) {
                console.error("Error:", error);
                alert("Error al agregar: " + error.message);
                button.textContent = originalText;
                button.disabled = false;
            })
            .agregarMPR(nuevaMp);
    }

    //-----------------Agregar elementos (clonar fieldset)------------------//
    function agregarElemento(idFormulario) {
      const form = document.getElementById(idFormulario);
      const original = form.querySelector("fieldset");
      const clon = original.cloneNode(true);

      // Agregar clase para identificar que es un clon
      clon.classList.add("clonado");

      //°°°°°°°Unicidad de IDs para correcto manejo de datos°°°°°°//
      // Limpiar los valores del clon y generar nuevos IDs únicos
      const inputs = clon.querySelectorAll("input, select, textarea");
      inputs.forEach((input) => {
        input.value = "";

        if (input.id) {
          const baseId = input.id.split("-")[0]; // id base sin sufijo
          const nuevoId = baseId + "-" + contadore;
          input.id = nuevoId;

          // Buscar el label asociado al id base y actualizar su atributo for
          const label = clon.querySelector(`label[for="${baseId}"]`);
          if (label) {
            label.setAttribute("for", nuevoId);
          }
        }
      });

      // Recargar las opciones de materia prima en el nuevo select clonado
      const newSelectMateriaPrima = clon.querySelector('select[name="materiaPrima[]"]');
      if (newSelectMateriaPrima) {
          // Limpiar opciones existentes (excepto la primera)
          while (newSelectMateriaPrima.options.length > 1) {
              newSelectMateriaPrima.remove(1);
          }
          // Añadir las opciones actualizadas
          materiasPrimasDisponibles.sort().forEach(mp => {
              const option = document.createElement("option");
              option.value = mp;
              option.textContent = mp;
              newSelectMateriaPrima.appendChild(option);
          });
          newSelectMateriaPrima.value = ""; // Resetear la selección del clon
      }


      //°°°°°° Insertar antes del mensaje final (mantener botón al final)°°°°°°//
      const final = form.querySelector("p[id='msgFinal']");
      form.insertBefore(clon, final);

      // Incrementar contador
      contadore++;

      //°°°°°°Hace el scroll automatico hasta el nuevo clon°°°°°//
      //clon.scrollIntoView({ behavior: "smooth" }); // Descomentar si se desea el scroll
    }

    //---------------Eliminar elementos------------------//
    function eliminarElemento(idFormulario){
      const form = document.getElementById(idFormulario);
      const clones = form.querySelectorAll("fieldset.clonado");
      if (clones.length > 0) {
        form.removeChild(clones[clones.length - 1]);
        contadore--;
      }
    }

    //-----------Enviar datos del formulario------------//
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      let datos = new FormData(e.target);

      const materiaPrima = datos.getAll("materiaPrima[]");
      const cantidad = datos.getAll("cantidad[]");
      const unidad = datos.getAll("unidad[]");

      const receta = materiaPrima.map((mat, i) => ({
        NombreMp: mat,
        Cantidad: cantidad[i],
        Tipos: unidad[i],
      }));

      google.script.run.guardarRecetaSheet(receta, datos.get("producto"), datos.get("user_message"));

      // limpiar dinámicos
      const dinamicos = document.querySelectorAll("fieldset.clonado");
      dinamicos.forEach(el => el.remove());
      // opcional: resetear el formulario completo
      document.getElementById("form").reset();
      // reiniciar contador
      contadore = 1;
      // Recargar las materias primas para asegurar que el primer select esté limpio
      cargarMateriasPrimasEnSelects(); 
    });

    // Cargar las materias primas al cargar la página por primera vez
    window.addEventListener('DOMContentLoaded', cargarMateriasPrimasDesdeSheets);
   
</script>
