    function mostrarPagina(id, navegador) {
      document.startViewTransition(() => {
        // Ocultar todos los divs(páginas) de contenido
        const secciones = document.querySelectorAll('.contenido');
        secciones.forEach(sec => sec.classList.remove('visible'));

        // Mostrar solo la seleccionada
        document.getElementById(id).classList.add('visible');
      })
  
      //Estila el Header de la sección donde se encuentra el usuario
      navegador.parentElement.querySelectorAll('li').forEach(li => li.classList.remove('activo'));
      navegador.classList.add('activo');

      // Controlar visibilidad del botón(svg(flechita)) "volver"
      const botonVolver = document.querySelector('#nav-inicio');
      if (id === 'definirProducto') {
        botonVolver.classList.add('show');
      } else {
        botonVolver.classList.remove('show');
      }
    }

        case "ventas:":

      }

    function mostrarAlertaTemporal(mensaje, duracionMs = 2000) {
      const alerta = document.getElementById("alertaTemporal");
      const overlay = document.getElementById("overlayBloqueo");

      alerta.textContent = mensaje;

      overlay.style.display = "block"; // Bloquea el fondo
      alerta.style.display = "block";  // Muestra el mensaje

      setTimeout(() => {
        alerta.style.display = "none";
        overlay.style.display = "none";
      }, duracionMs);
    }

    //-----------Enviar datos del formulario------------//
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const form = e.target;
      const datos = new FormData(form);

      const fechaPago = datos.get("fechaPago");
      const nombreEmpleado = datos.get("Nempleado");
      const cantServicios = datos.getAll("Nservicios[]");
      const sueldo = datos.get("Nsueldo");
      const sueldoEntreCantServicios = sueldo / cantServicios.length;
      const letraExactaQuery =await columnaExactaEmpleado(nombreEmpleado);
      const servYpagosHoras = {};
      console.log(nombreEmpleado);
      console.log(letraExactaQuery);
      for (const servicio of cantServicios) {
        const response = await fetchSheetData(
          'Pago de Sueldos',
          `SELECT ${letraExactaQuery} WHERE F = '${servicio}'`
        );

        const data = response.getDataTable();

        if (data.getNumberOfRows() > 0 && data.getNumberOfColumns() > 0) {
          const horas = data.getValue(0, 0);
          const sueldoPorHora = `#${parseInt(sueldoEntreCantServicios / horas)}`;
          servYpagosHoras[servicio] = sueldoPorHora;
        } else {
          console.log("No se encontraron datos para:", servicio);
        }
      }
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.dataset.orig = submitBtn.textContent;
        submitBtn.textContent = "Guardando...";
      }
      const serviciosAnidados = cantServicios.join(",")
      google.script.run.withSuccessHandler(function(){
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = submitBtn.dataset.orig || "Enviar";
          }     
            form.reset();
      }).gestionarPagoSueldo(nombreEmpleado,servYpagosHoras,sueldo,idParaGraficoPrueba,serviciosAnidados);
    });
