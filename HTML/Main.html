      <form action="ruta o url para obtener los datos" method="post" id="form">

        </p>

        <button id="agg" type="button" onclick="agregarElemento('form')"> + Agregar materia prima</button>
        <button id="supr" type="button" onclick="eliminarElemento('form')"> - Eliminar materia prima</button>
        
        <fieldset id="contenedorElementos"> 
          <p class="element">
            <label for="materiaPrima">Materia Prima:</label>
            <select name="materiaPrima[]" id="materiaPrima">
              <option value="">--Seleccione Materia Prima--</option>
              </select>
          </p>
          <p class="cant">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad[]" min="0" step="any"/>
          </p>
          <p class="unit">
            <label for="unidad">Unidad:</label>
            <select name="unidad[]" id="unidad">
              <option value="">--Por favor elige una opción--</option>
              <option value="unidades">Unidades</option>
              <option value="litros">Kg</option>
              <option value="mililitro">Gr</option>
              <option value="gramos">Lts</option>
              <option value="kilogramo">Mlts</option>
            </select>
          </p>
        </fieldset>
        <p id="msgFinal">

        </p>
