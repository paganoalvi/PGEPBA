      <!-- ////// PÁGINA PARA DEFINIR UNA RECETA ////// -->
      <div id="definirProducto" class="contenido">
        <button id="agg" onclick="agregarElemento('form','contenedorElementos')"> + Agregar elemento </button>
        <button id="supr" onclick="eliminarElemento('form')"> - Eliminar elemento </button>
        <h2>Crea tu producto</h2>
        <form action="ruta o url para obtener los datos" method="post" id="form">
          <p class="element">
              <label for="nombreProducto">Nombre del producto:</label>
              <input type="text" id="nombreProducto" name="producto" required/>
            </p>
          <h2>Receta del producto</h2>
          <fieldset id="contenedorElementos"> 
            <p class="element">
              <label for="nombreMateriaPrima">Materia Prima:</label>
              <input type="text" id="nombreMateriaPrima" name="materiaPrima[]"/>
            </p>
            <p class="cant">
              <label for="cantidad">Cantindad:</label>
              <input type="number" id="cantidad" name="cantidad[]"/>
            </p>
            <p class="unit">
              <label for="unidad">Unidad:</label>
              <select name="unidad[]" id="unidad">
                <option value="">--Por favor elige una opción--</option>
                <option value="unidades">Unidades</option>
                <option value="litros">Litros</option>
                <option value="mililitro">Mililitros</option>
                <option value="kilos">Kilos</option>
                <option value="gramos">Gramos</option>
                <option value="kilogramo">Kilogramos</option>
                <option value="miligramo">Miligramos</option>
                <option value="libra">Libras</option>
              </select>
            </p>
          </fieldset>
          <p id="msgFinal">
            <label for="msg">Message:</label>
            <textarea id="msg" name="user_message"></textarea>
          </p>
          <button type="submit">Enviar</button>
        </form>
