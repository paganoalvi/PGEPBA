<script>
// Array de servicios disponibles

        function generarCheckboxes(divId, nombres) {
            const contenedor = document.getElementById(divId);
            contenedor.innerHTML = '';
            
            nombres.forEach((nombre, indice) => {
                const checkboxItem = document.createElement('div');
                checkboxItem.className = 'checkbox-item';
                
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.id = `${divId}_${indice}`;
                input.name = 'Nservicios[]';
                input.value = nombre;
                
                const label = document.createElement('label');
                label.htmlFor = input.id;
                label.textContent = nombre;
                
                checkboxItem.appendChild(input);
                checkboxItem.appendChild(label);
                contenedor.appendChild(checkboxItem);
            });
        }
        /*Funcion mostrarServicios() CON SWEETALERT*/
        async function mostrarServicios() {
          const empleadoSeleccionado = document.getElementById('empleado').value;
          const contenedorServicios = document.getElementById('servicios-contenedor');
          
          if (!empleadoSeleccionado) {
            Swal.fire({
              title: '¡Atención!',
              text: 'Por favor, seleccioná un empleado',
              icon: 'warning',
              showCancelButton: true,
              confirmButtonColor: '#3085d6',
              cancelButtonColor: '#d33',
              confirmButtonText: 'Seleccionar ahora',
              cancelButtonText: 'Cancelar'
            }).then((result) => {
              if (result.isConfirmed) {
                // Opcional: puedes hacer focus en el select
                document.getElementById('empleado').focus();
              }
            });
            return;
          }
          
          const servicios = await cargarServiciosDelEmpleado(empleadoSeleccionado);
          generarCheckboxes('servicios', servicios);
        }

      /////////////////////////////////////////////////////////////////
      /////CARGAR SERVICIOS DINAMICAMENTE CUANDO SE SELECCIONA EMPLEADO (FUNCION PARA TRAER LOS SERVICIOS DEL SHEETS)
      /////////////////////////////////////////////////////////////////
      async function cargarServiciosDelEmpleado(empleado) {
        const colLetra = await columnaExactaEmpleado(empleado);
        const queryServicios = `SELECT F, ${colLetra}`; 
        const servCrudo = await fetchSheetData("Pago de Sueldos", queryServicios);
        const servicios = servCrudo.getDataTable();
        const serviciosArray = [];
        const numRows = servicios.getNumberOfRows();
        for (let i = 0; i < numRows; i++) {
          const valorF = servicios.getValue(i, 0);      // columna F
          const valorCol = servicios.getValue(i, 1);    // columna del empleado
          if (typeof valorCol === "number") {
            serviciosArray.push(valorF);
          }
        }
        return serviciosArray;
      }


      async function columnaExactaEmpleado(empleado){
        const queryText = "SELECT * LIMIT 1 OFFSET 0"; // Trae la primera fila
        const response = await fetchSheetData("Pago de Sueldos", queryText);
        const data = response.getDataTable();
        const nombresEmpleados = [];
        for (let c = 0; c < data.getNumberOfColumns(); c++) {
          const label = data.getColumnLabel(c);
          nombresEmpleados.push(label);
        }
        const indiceEmp = nombresEmpleados.indexOf(empleado)+1;
        const colLetra = colToLetter(indiceEmp);
        return colLetra;
      }

        /////////////FUNCION AUXILIAR PARA TRANSFORMAR NUMERO A LETRA COLUMNA////////

        function colToLetter(colNum) {
          let letter = '';
          while (colNum > 0) {
            let remainder = (colNum - 1) % 26;
            letter = String.fromCharCode(65 + remainder) + letter; // 65 = 'A'
            colNum = Math.floor((colNum - 1) / 26);
          }
          return letter;
        }
</script>
